layout: {qmk_keyboard: crkbd/rev2, layout_name: LAYOUT_split_3x6_3}

layers:
  BASE:
    - [TAB, b, l, d, c, v, j, y, o, u, ';', ENT]
    - "'"
    - {t: n, h: LGUI}
    - {t: r, h: LALT}
    - {t: t, h: LCTL}
    - {t: s, h: LSFT}
    - {t: g, h: RALT}
    - {t: p, h: RALT}
    - {t: h, h: LSFT}
    - {t: a, h: LCTL}
    - {t: e, h: LALT}
    - {t: i, h: LGUI}
    - BSPC
    - ['', x, q, m, w, z, k, f, ',', '.', '/', '']
    - ['', {t: ESC, h: NAV}, {t: BSPC, h: SYS}, {t: "'", h: SYM}, {t: SPC, h: NUM}, '']

  CED:
    - ['', '', '', '', '', '', '', '', '', '', '', '']
    - ['', '', '', '', 'ã', '', '', 'ão', '', '', '', '']
    - ['', '', '', '', 'õ', '', '', 'ões', '', '', '', '']
    - ['', '', '', '', '', '']

  NUM:
    - ['', '`', '9', '8', '7', '[', '', '', '', '', '', '']
    - ['', "'", '3', '2', '1', '=', 'RALT', 'LSFT', 'LCTL', 'LALT', 'LGUI', '']
    - ['', '/', '6', '5', '4', ']', '', '', '', '', 'LLCK', '']
    - ['', {t: '0', h: FUN}, '\', '', {type: held}, '']

  SYM:
    - ['', '^', '~', '{', '(', '&', '', '', '', '', '', '']
    - ['', '%', '#', '*', '!', '+', 'RALT', 'LSFT', 'LCTL', 'LALT', 'LGUI', '']
    - ['', '@', '|', '}', ')', '$', '', '', '', '', 'LLCK', '']
    - ['', '-', '_', {type: held}, '', '']

  NAV:
    - ['', C-z, C-a, C-v, C-c, C-x, '', BSPC, ENT, TAB, '', '']
    - ['', LGUI, LALT, LCTL, LSFT, VOLU, LEFT, DOWN, UP, RGHT, CAPS, '']
    - ['', LLCK, {t: MOU, type: toggle}, MUTE, MPLY, VOLD, HOME, PGDN, PGUP, END, '', '']
    - ['', {type: held}, '', INS, {t: DEL, h: FUN}, '']

  MOU:
    - ['', C-z, C-u, C-v, C-c, C-x, C-x, C-c, C-v, C-u, C-z, '']
    - ['', LGUI, LALT, LCTL, LSFT, VOLU, MS_LEFT, MS_DOWN, MS_UP, MS_RGHT, TAB, '']
    - ['', VOLD, MPRV, MPLY, MNXT, MOU_BRR, MS_WHLL, MS_WHLD, MS_WHLU, MS_WHLR, MS_BTN3, '']
    - ['', '', '', MS_BTN2, MS_BTN1, '']

  FUN:
    - ['', F10, F9, F8, F7, PAUS, {t: FPS, type: toggle}, DM_PLY1, DM_REC1, DM_RSTP, '', {t: GMP, type: toggle}]
    - ['', F11, F3, F2, F1, PSCR, {t: MOBA, type: toggle}, LSFT, LCTL, LALT, LGUI, QK_BOOT]
    - ['', F12, F6, F5, F4, EE_CLR, QK_LOCK, APP, PST, '', '', 'LLCK']
    - ['', {type: held}, '', '', {type: held}, '']

  FPS:
    - [T, TAB, Q, W, E, R, Y, U, I, O, P, '']
    - [G, LSFT, A, S, D, F, H, J, K, L, ';', '']
    - [B, LCTL, Z, X, C, V, N, M, ',', '.', '/', {t: FPS, type: toggle}]
    - [{t: FPSN, type: held}, SPC, ESC, ENT, BSPC, '']

  FPSN:
    - ['1', '2', '3', '', '4', '5', '', '', '', '', '', '']
    - ['0', '', '', '', '', '6', '', '', '', '', '', '']
    - ['`', '', '9', '', '8', '7', '', '', '', '', '', '']
    - [{type: held}, '', '', '', '', '']

  MOBA:
    - [TAB, Q, W, E, R, T, Y, U, I, O, P, '']
    - [LSFT, A, S, D, F, G, H, J, K, L, ';', '']
    - [LCTL, Z, X, C, V, B, N, M, ',', '.', '/', {t: MOBA, type: toggle}]
    - ['-', {t: MOBAN, type: held}, ESC, ENT, BSPC, '']

  MOBAN:
    - [TAB, '6', '7', '6', '8', '9', '', '', '', '', '', '']
    - [LSFT, '1', '2', '3', '4', '5', '', '', '', '', '', '']
    - [LCTL, '`', '\', ']', '[', '/', '', '', '', '', '', '']
    - ['', {type: held}, '', '', '', '']

  GMP:
    - [JS9, JS8, '', '', JS_DN, JS_LT, '', '', '', '', '', '']
    - [JS1, JS3, '', SPC, JS_RT, JS_UP, '', '', '', '', '', '']
    - [JS0, JS2, JS5, JS7, JS6, JS4, '', '', '', '', '', {t: GMP, type: toggle}]
    - ['', '', '', '', SPC, '']

  SYS:
    - ['', G-q, WM9, WM8, WM7, '', '', '', '', '', '', '']
    - ['', C-a, WM3, WM2, WM1, '', '', LSFT, '', '', '', '']
    - ['', '', WM6, WM5, WM4, '', '', '', '', '', '', '']
    - ['', '', {type: held}, '', '', '']

  PST:
    - ['', '', '', '', '', '', '', '', '', '', '', '']
    - ['', '', LKL, GHL, EML, '', '', '', '', '', '', '']
    - ['', '', '', '', '', '', '', '', '', '', '', '']
    - ['', '', '', '', '', '']

combos:
  - {p: [2, 3], k: "TAB", l: ["BASE"]}
  - {p: [3, 4], k: "´", l: ["BASE"]}
  - {p: [4, 5], k: "DEL", l: ["BASE"]}
  - {p: [6, 7], k: "CAPS", l: ["BASE"]}
  - {p: [7, 8], k: "$", l: ["BASE"]}
  - {p: [8, 9], k: "&", l: ["BASE"]}
  - {p: [26, 27], k: "^", l: ["BASE"]}
  - {p: [27, 28], k: "~", l: ["BASE"]}
  - {p: [2, 3], k: "LCS-c", l: ["NAV"]}
  - {p: [3, 4], k: "LCS-v", l: ["NAV"]}
